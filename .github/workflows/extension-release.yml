name: Release extension

# Run from the Actions tab. Bumps the version, tags extension-v<version>, publishes the same .vsix to the
# VS Code Marketplace and Open VSX, and attaches it to a GitHub Release. Choose "none" to retry a failed
# publish of the current version; publishing skips versions a registry already has.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major, none]
        default: patch

permissions:
  contents: write

concurrency:
  group: extension-release
  cancel-in-progress: false

defaults:
  run:
    working-directory: vscode-extension

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci

      - name: Bump version
        if: inputs.bump != 'none'
        run: npm version ${{ inputs.bump }} --no-git-tag-version

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=extension-v$version" >> "$GITHUB_OUTPUT"
          echo "vsix=claude-skills-$version.vsix" >> "$GITHUB_OUTPUT"

      # Packaging compiles first, so a broken build stops the release before anything is pushed.
      - run: npx vsce package --out ${{ steps.version.outputs.vsix }}

      - name: Commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain package.json package-lock.json)" ]; then
            git add package.json package-lock.json
            git commit -m "chore(extension): release $VERSION"
            git push origin HEAD:main
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT is not set, skipping the VS Code Marketplace"
            exit 0
          fi
          npx vsce publish --packagePath ${{ steps.version.outputs.vsix }} --skip-duplicate

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT is not set, skipping Open VSX"
            exit 0
          fi
          npx ovsx publish ${{ steps.version.outputs.vsix }} --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VSIX: ${{ steps.version.outputs.vsix }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" --clobber
            exit 0
          fi
          previous=$(git tag --list 'extension-v*' --sort=-v:refname | grep -vx "$TAG" | head -n 1)
          range=${previous:+$previous..}$TAG
          {
            echo "## Changes"
            git log "$range" --no-merges --format='- %s (%h)' -- . ':!package.json' ':!package-lock.json'
          } > notes.md
          gh release create "$TAG" "$VSIX" --title "Claude Skills $TAG" --notes-file notes.md
