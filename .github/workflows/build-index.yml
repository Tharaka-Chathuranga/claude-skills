name: Build catalog

on:
  push:
    branches: [main]
    paths: ['skills-library/**', '.github/workflows/build-index.yml']
  pull_request:
    paths: ['skills-library/**', '.github/workflows/build-index.yml']

permissions:
  contents: write

defaults:
  run:
    working-directory: skills-library

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Fails the PR when a skill breaks a limit in AUTHORING.md or a module.json is wrong.
      - run: node scripts/build-index.mjs
      - name: Commit catalog if it changed
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain catalog)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog
            git commit -m "chore: rebuild catalog"
            git push
          fi
